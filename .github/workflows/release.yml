name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: sh -n install.sh install-online.sh uninstall.sh
      - run: pytest

  source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build versioned source archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="wallpilot-${version}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="wallpilot-${version}/" \
            --output="$archive" \
            "$GITHUB_REF_NAME"
          sha256sum "$archive" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="wallpilot-${version}.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "${archive}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "WallPilot ${GITHUB_REF_NAME}"
